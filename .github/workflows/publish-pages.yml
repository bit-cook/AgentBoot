name: publish-pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 与 deploy-pages.yml 同一组并发键，避免两个发布通道同时写 Pages。
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, pages-fix]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # upload-pages-artifact 的归档步骤经 bash 调用 GNU tar；Windows
      # self-hosted runner 需显式把 Git 的 usr/bin 注入后续步骤 PATH。
      - name: Ensure GNU tar on PATH (Windows self-hosted)
        if: runner.os == 'Windows'
        shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\usr\bin'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: gh-pages
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
