name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "cloudflare/**"
      - "core/**"
      - "docs/**"
      - "scripts/**"
      - "tools/**"
      - "pages/**"
      - "tests/**"
      - "README*.md"
      - "CHANGELOG.md"
      - "install.*"
      - "安装指南.md"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python3 -m py_compile core/*.py scripts/tools/*.py scripts/build-online.py
      - name: Build online packages
        run: python3 scripts/build-online.py
      - name: Verify package payload
        run: |
          tar -tzf pages/agentboot-online-v1.0.0.tar.gz | grep -F 'AgentBoot/core/menu.py'
          python3 -m zipfile -l pages/agentboot-online-v1.0.0.zip | grep -F 'AgentBoot/core/menu.py'

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build online packages
        run: |
          cp install.sh pages/install.sh
          cp scripts/install.ps1 pages/install.ps1
          python3 scripts/build-online.py
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
