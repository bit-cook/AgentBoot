name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "cloudflare/**"
      - "core/**"
      - "docs/**"
      - "scripts/**"
      - "tools/**"
      - "pages/**"
      - "tests/**"
      - "README*.md"
      - "CHANGELOG.md"
      - "VERSION"
      - "install.*"
      - "安装指南.md"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  quality:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python3 -m py_compile core/*.py scripts/tools/*.py scripts/build-online.py
      - name: Verify generated web assets
        run: python3 scripts/sync-web-assets.py --check
      - name: Lint workflows (actionlint)
        shell: bash
        # job 级 env 误用 runner.temp 曾让发布流水线无法解析；此处提前拦截
        run: |
          # 国内网络直连 GitHub release 资产不稳定：重试 + 代理镜像兜底
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz" \
            || curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 -o /tmp/actionlint.tar.gz \
            "https://gh-proxy.com/https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp
          /tmp/actionlint .github/workflows/*.yml
      - name: Build online packages
        run: python3 scripts/build-online.py
      - name: Verify package payload
        shell: bash
        run: |
          tag="v$(cat VERSION)"
          (cd pages && sha256sum -c "agentboot-online-${tag}.tar.gz.sha256" "agentboot-online-${tag}.zip.sha256")
          tar -tzf "pages/agentboot-online-${tag}.tar.gz" | grep -F 'AgentBoot/core/menu.py'
          python3 -m zipfile -l "pages/agentboot-online-${tag}.zip" | grep -F 'AgentBoot/core/menu.py'

  deploy:
    needs: quality
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build online packages
        run: |
          cp install.sh pages/install.sh
          cp scripts/install.ps1 pages/install.ps1
          python3 scripts/build-online.py
      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth 1
          # 自托管 runner 的 _work 目录跨运行复用：先清理上次遗留的 worktree
          # 注册与目录，否则 git worktree add 会因路径已存在而失败（exit 128）
          git worktree remove ../gh-pages --force 2>/dev/null || true
          git worktree prune
          rm -rf ../gh-pages
          git worktree add ../gh-pages origin/gh-pages
          find ../gh-pages -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r pages/. ../gh-pages/
          cd ../gh-pages
          git add -A
          git diff --cached --quiet || git commit -m "pages: deploy ${GITHUB_SHA}"
          git push origin HEAD:gh-pages
